name: Atualizar IDs RedeFlix

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sincronizar filmes, séries, animes e doramas
        run: python3 atualizar_redeflix.py
      - name: Publicar somente quando houver IDs ou episódios novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vod/redeflix
          git diff --cached --quiet || git commit -m "Atualiza IDs RedeFlix"
          git push
