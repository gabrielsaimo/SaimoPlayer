name: Atualizar catálogo

# Duas partes, sempre nesta ordem: primeiro as fontes novas da RedeFlix,
# depois as fileiras da tela inicial — que leem justamente o que a primeira
# acabou de gravar em vod/redeflix. Rodar só a segunda mostraria as novidades
# de ontem.
on:
  schedule:
    # Todo dia às 11h17 em Brasília (14h17 UTC), junto da rodada do Mac às 11h.
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # O cache do resolvedor não fica no Git (é um sqlite de dezenas de MB),
      # e sem ele toda execução recomeçaria do zero — uma hora por dia batendo
      # de novo no que já foi resolvido ontem. Guardando entre as execuções, o
      # dia seguinte só pega o que entrou.
      - name: Fontes da lista principal (nixplay)
        run: python3 atualizar_nixplay.py
      - name: Montar o acervo consolidado
        run: python3 gerar_vod.py
      - name: Capas e gêneros dos títulos novos
        run: python3 gerar_generos.py
      - name: IDs do IMDb dos títulos novos (legendas)
        run: python3 gerar_imdb.py
      - name: Montar as fileiras da tela inicial
        run: python3 gerar_destaques.py
      - name: Registrar novidades da rodada
        run: python3 gerar_novidades.py
      - name: Publicar somente quando houver alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vod
          git diff --cached --quiet || git commit -m "Atualiza catálogo e destaques"
          git push
      # Push feito com o GITHUB_TOKEN do fluxo não dispara os outros fluxos:
      # publicar e espelhar são chamados aqui, direto. Sem os segredos, avisam e
      # seguem (ver publicar-catalogos.yml e espelhar-legado.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publicar nos links dos apps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::sem CLOUDFLARE_API_TOKEN: links dos apps não atualizados por aqui (o Mac publica na rodada dele)"
            exit 0
          fi
          npm install -g wrangler@4
          bash scripts/publicar_catalogos.sh
      - name: Espelhar no repositório antigo
        env:
          LEGADO_TOKEN: ${{ secrets.LEGADO_TOKEN }}
          LEGADO_REPO: ${{ vars.LEGADO_REPO }}
        run: |
          if [ -z "$LEGADO_TOKEN" ] || [ -z "$LEGADO_REPO" ]; then exit 0; fi
          git push "https://x-access-token:${LEGADO_TOKEN}@github.com/${LEGADO_REPO}.git" HEAD:main
